<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Center - Cotizador Inteligente B2B</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #f39c12;
            --success-color: #27ae60;
            --light-color: #ecf0f1;
            --dark-color: #2c3e50;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: var(--dark-color);
            line-height: 1.6;
        }

        /* Layout */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            position: fixed;
            height: 100vh;
        }

        .main-content {
            margin-left: 250px;
            flex: 1;
            padding: 20px;
            background-color: #f9f9f9;
        }

        /* Login */
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: white;
        }

        .login-form {
            width: 90%;
            max-width: 400px;
            padding: 30px;
            background-color: white;
            box-shadow: var(--shadow);
            border-radius: var(--border-radius);
            text-align: center;
        }

        .login-form h2 {
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .login-form input, .login-form button {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
        }

        .login-form button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        /* Dashboard */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Cotizador */
        .cotizador-container {
            background-color: white;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .cotizador-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .cotizador-form input,
        .cotizador-form select,
        .cotizador-form button {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
        }

        .cotizador-form button {
            background-color: var(--secondary-color);
            color: white;
            cursor: pointer;
            grid-column: 1 / -1;
        }

        /* Resultados */
        .resultados-container {
            margin-top: 20px;
            background-color: white;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .resultado-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .resultado-item:last-child {
            border-bottom: none;
        }

        .resultado-total {
            font-weight: bold;
            font-size: 18px;
            margin-top: 10px;
            text-align: right;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Login -->
    <div class="login-container" id="loginPage">
        <div class="login-form">
            <h2>Iniciar Sesión</h2>
            <input type="email" placeholder="Correo electrónico" id="email" required>
            <input type="password" placeholder="Contraseña" id="password" required>
            <button onclick="login()">Iniciar sesión</button>
        </div>
    </div>

    <!-- App Principal -->
    <div class="app-container" id="appPage" style="display: none;">
        <aside class="sidebar">
            <h2>Fire Center</h2>
            <nav>
                <ul>
                    <li><a href="#" onclick="showSection('cotizador')">Cotizador</a></li>
                    <li><a href="#" onclick="showSection('historial')">Historial</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content" id="mainContent">
            <!-- Cotizador -->
            <div id="cotizador" class="section">
                <div class="cotizador-container">
                    <h2>Cotizador Inteligente B2B</h2>
                    <form class="cotizador-form" onsubmit="calcularCotizacion(event)">
                        <input type="text" placeholder="Nombre del Cliente" id="nombreCliente" required>
                        <input type="number" placeholder="Metraje del Local (m²)" id="metraje" required>
                        <select id="rubros" required>
                            <option value="">Seleccionar Rubro</option>
                            <option value="educacion">Educación (Colegios, Universidades)</option>
                            <option value="industrial">Industrial (Fábricas, Talleres)</option>
                            <option value="comercial">Comercial (Tiendas, Oficinas)</option>
                            <option value="residencial">Residencial (Condominios, Edificios)</option>
                        </select>
                        <button type="submit">Calcular Cotización</button>
                    </form>
                    <div class="resultados-container" id="resultadosContainer" style="display: none;">
                        <h3>Resultados de la Cotización</h3>
                        <div id="resultadosLista"></div>
                        <div class="resultado-total" id="resultadoTotal"></div>
                        <button onclick="enviarCotizacion()">Enviar Cotización por Correo</button>
                    </div>
                </div>
            </div>

            <!-- Historial -->
            <div id="historial" class="section" style="display: none;">
                <div class="cotizador-container">
                    <h2>Historial de Cotizaciones</h2>
                    <table class="extintores-table">
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Fecha</th>
                                <th>Total</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="historialTableBody">
                            <tr>
                                <td>Colegio San Ignacio</td>
                                <td>15/03/2026</td>
                                <td>S/ 2,450.00</td>
                                <td><button onclick="verDetalleCotizacion('1')">Ver Detalle</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Autenticación
        function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (email && password) {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('appPage').style.display = 'flex';
                showSection('cotizador');
            } else {
                alert('Por favor, complete los campos.');
            }
        }

        function logout() {
            document.getElementById('appPage').style.display = 'none';
            document.getElementById('loginPage').style.display = 'flex';
        }

        // Navegación
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(section => {
                section.style.display = 'none';
            });
            document.getElementById(sectionId).style.display = 'block';
        }

        // Lógica del Cotizador
        function calcularCotizacion(event) {
            event.preventDefault();

            const nombreCliente = document.getElementById('nombreCliente').value;
            const metraje = parseFloat(document.getElementById('metraje').value);
            const rubro = document.getElementById('rubros').value;

            if (!nombreCliente || !metraje || !rubro) {
                alert('Por favor, complete todos los campos.');
                return;
            }

            // Lógica de cálculo según NTP (Norma Técnica Peruana)
            let productos = [];
            let total = 0;

            if (rubro === 'educacion') {
                productos = [
                    { nombre: 'Extintor ABC 10kg', cantidad: Math.ceil(metraje / 100), precio: 250 },
                    { nombre: 'Señalética de Emergencia', cantidad: 2, precio: 80 },
                    { nombre: 'Kit de Primeros Auxilios', cantidad: 1, precio: 150 }
                ];
            } else if (rubro === 'industrial') {
                productos = [
                    { nombre: 'Extintor ABC 20kg', cantidad: Math.ceil(metraje / 75), precio: 400 },
                    { nombre: 'Señalética Industrial', cantidad: 3, precio: 120 },
                    { nombre: 'Kit de Derrame Químico', cantidad: 1, precio: 300 }
                ];
            } else if (rubro === 'comercial') {
                productos = [
                    { nombre: 'Extintor ABC 6kg', cantidad: Math.ceil(metraje / 150), precio: 180 },
                    { nombre: 'Señalética Comercial', cantidad: 1, precio: 60 }
                ];
            } else if (rubro === 'residencial') {
                productos = [
                    { nombre: 'Extintor ABC 4kg', cantidad: Math.ceil(metraje / 200), precio: 120 },
                    { nombre: 'Detectores de Humo', cantidad: 2, precio: 50 }
                ];
            }

            // Calcular total
            total = productos.reduce((sum, producto) => sum + (producto.cantidad * producto.precio), 0);

            // Mostrar resultados
            const resultadosLista = document.getElementById('resultadosLista');
            resultadosLista.innerHTML = productos.map(producto =>
                `<div class="resultado-item">
                    <span>${producto.cantidad} x ${producto.nombre}</span>
                    <span>S/ ${(producto.cantidad * producto.precio).toFixed(2)}</span>
                </div>`
            ).join('');

            document.getElementById('resultadoTotal').textContent = `Total: S/ ${total.toFixed(2)}`;
            document.getElementById('resultadosContainer').style.display = 'block';
        }

        // Enviar Cotización
        function enviarCotizacion() {
            alert('Cotización enviada por correo al cliente. (Simulación)');
            // En un entorno real, aquí se integraría con un backend para enviar el correo
        }

        // Ver Detalle de Cotización
        function verDetalleCotizacion(id) {
            alert(`Mostrando detalle de la cotización ${id}. (Simulación)`);
        }
    </script>
</body>
</html>
